name: DesignPro quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: designpro-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: API, security and workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check apps/api/server.mjs
          node --check apps/web/app.js
      - name: Run all unit, API, webhook and negative UAT tests
        run: npm test
      - name: Verify SQLite migration idempotency and schema integrity
        run: npm run schema:preflight
      - name: Measure coverage (informational)
        run: npm run coverage

  responsive-smoke:
    name: Responsive browser smoke (automated)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Execute responsive UI smoke suite
        run: python tests/visual-smoke.py
